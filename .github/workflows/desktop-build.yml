name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: desktop:build:win
            artifact: receipt-studio-windows
          - os: macos-latest
            command: desktop:build:mac
            artifact: receipt-studio-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'macOS'
        run: npm run desktop:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.html
          if-no-files-found: error
